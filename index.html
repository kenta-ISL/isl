<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISL AI Virtual Office</title>
    <style>
        :root { --primary: #1A365D; --bg: #F7FAFC; --card: #FFFFFF; --text: #2D3748; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 15px; }
        .header { background: var(--primary); color: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #4A5568; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #E2E8F0; border-radius: 8px; margin-bottom: 12px; font-size: 1rem; }
        button { width: 100%; background: #3182CE; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2B6CB0; }
        .agent-box { border-left: 4px solid #3182CE; padding-left: 10px; margin-top: 15px; background: #EBF8FF; padding: 10px; border-radius: 4px; }
        .cs { border-color: #3182CE; background: #EBF8FF; }
        .tech { border-color: #319795; background: #E6FFFA; }
        .sales { border-color: #DD6B20; background: #FFFAF0; }
        .loading { text-align: center; color: #718096; display: none; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="header">🏛️ ISL AI MOBILE OFFICE</div>

    <div class="card">
        <label>👤 顧客氏名（名簿照合用）</label>
        <input type="text" id="senderName" value="川村 健太" placeholder="例: 川村 健太">
        
        <label>💬 お問い合わせ内容・依頼</label>
        <textarea id="messageContent" rows="4" placeholder="例: Fortinetのファイアウォールを2台レンタルしたい。見積もりをください。"></textarea>
        
        <button onclick="launchAIOffice()">🚀 AI作戦会議を招集する</button>
        <div class="loading" id="loader">⏳ ローカルGPU(GTX1080)でAIエージェントが思考中...</div>
    </div>

    <div id="results" style="display: none;">
        <div class="card">
            <h4>📊 顧客認識結果</h4>
            <p id="custInfo" style="font-weight: bold; color: var(--primary); margin-top: 5px;"></p>
        </div>
        <div class="card agent-box cs">
            <strong>💁‍♀️ CS担当 (AI) の分析</strong>
            <p id="csRes" style="margin-top:5px; white-space: pre-wrap;"></p>
        </div>
        <div class="card agent-box tech">
            <strong>🛠️ 技術スタッフ (AI) の構成案</strong>
            <p id="techRes" style="margin-top:5px; white-space: pre-wrap;"></p>
        </div>
        <div class="card agent-box sales">
            <strong>💰 営業担当 (AI) の最終査定 & 明細</strong>
            <p id="salesRes" style="margin-top:5px; white-space: pre-wrap;"></p>
        </div>
    </div>

    <script>
        async def launchAIOffice() {
            const sender = document.getElementById('senderName').value;
            const msg = document.getElementById('messageContent').value;
            if(!msg) return alert('内容を入力してください');

            document.getElementById('loader').style.display = 'block';
            document.getElementById('results').style.display = 'none';

            // 🔗 トンネル経由で、ボスの自宅の新PC（Python）にアクセス
            // ※ 次のステップで発行される「lhr.life」や「serveo.net」のURLに書き換えます
            const tunnelUrl = "https://68ae41f8b5f091.lhr.life"; 

            try {
                const response = await fetch(`${tunnelUrl}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender_name: sender, message: msg })
                });
                const data = await response.json();

                if(data.status === 'success') {
                    document.getElementById('custInfo').innerText = data.customer_info;
                    document.getElementById('csRes').innerText = data.cs_response;
                    document.getElementById('techRes').innerText = data.tech_response;
                    document.getElementById('salesRes').innerText = data.sales_response;
                    document.getElementById('results').style.display = 'block';
                }
            } catch (error) {
                alert('新PCのPythonサーバーと通信できませんでした。トンネルが起動しているか確認してください。');
            } finally {
                document.getElementById('loader').style.display = 'none';
            }
        }
    </script>
</body>
</html>
